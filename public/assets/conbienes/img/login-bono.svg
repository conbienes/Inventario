<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Módulo Bono Regalo">
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#001F33" flood-opacity=".38"/>
    </filter>
    <linearGradient id="tarjeta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FB"/>
    </linearGradient>
    <linearGradient id="tarjeta2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A6AA0"/>
      <stop offset="1" stop-color="#004A75"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="160" r="138" fill="#FFFFFF" opacity=".06"/>
  <circle cx="200" cy="160" r="104" fill="#FFFFFF" opacity=".06"/>

  <!-- tarjeta trasera -->
  <g transform="rotate(-12 170 120)" filter="url(#sombra)">
    <rect x="70" y="62" width="200" height="120" rx="16" fill="url(#tarjeta2)"/>
    <circle cx="240" cy="92" r="40" fill="#FFFFFF" opacity=".12"/>
    <rect x="90" y="150" width="70" height="8" rx="4" fill="#FFFFFF" opacity=".6"/>
  </g>

  <!-- tarjeta principal -->
  <g filter="url(#sombra)">
    <rect x="110" y="96" width="210" height="128" rx="16" fill="url(#tarjeta)"/>
  </g>
  <!-- cinta -->
  <rect x="170" y="96" width="16" height="128" fill="#005484"/>
  <rect x="110" y="140" width="210" height="14" fill="#005484" opacity=".9"/>
  <!-- moño -->
  <path d="M178 147 C150 118 132 132 146 146 C152 152 166 150 178 147z" fill="#F59E0B"/>
  <path d="M178 147 C206 118 224 132 210 146 C204 152 190 150 178 147z" fill="#F59E0B"/>
  <path d="M178 147 l-16 30 l8 -2 l4 8z M178 147 l16 30 l-8 -2 l-4 8z" fill="#D97706"/>
  <circle cx="178" cy="147" r="8" fill="#B45309"/>
  <!-- texto simulado -->
  <rect x="216" y="112" width="86" height="10" rx="5" fill="#005484"/>
  <rect x="236" y="166" width="66" height="8" rx="4" fill="#B6D3E6"/>
  <rect x="252" y="180" width="50" height="8" rx="4" fill="#DCEBF5"/>
  <rect x="126" y="196" width="36" height="14" rx="4" fill="#FDE68A"/>
  <text x="302" y="210" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#005484">$100.000</text>

  <!-- caja de regalo -->
  <g filter="url(#sombra)">
    <rect x="34" y="200" width="70" height="56" rx="6" fill="url(#caja)"/>
    <rect x="28" y="188" width="82" height="18" rx="5" fill="#0A6AA0"/>
  </g>
  <rect x="62" y="188" width="14" height="68" fill="#F59E0B"/>
  <path d="M69 188 C54 166 40 178 54 186z M69 188 C84 166 98 178 84 186z" fill="#F59E0B"/>

  <!-- chispas -->
  <path d="M332 62 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4z" fill="#FDE68A"/>
  <path d="M60 70 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill="#FFFFFF" opacity=".85"/>
  <path d="M350 246 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z" fill="#FDE68A"/>
  <circle cx="300" cy="270" r="4" fill="#7DD3FC"/>
  <circle cx="120" cy="56" r="3" fill="#7DD3FC"/>
  <circle cx="356" cy="140" r="3" fill="#FFFFFF" opacity=".7"/>
</svg>
