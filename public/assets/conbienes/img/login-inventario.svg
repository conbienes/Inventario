  <g filter="url(#sombra)">
    <rect x="270" y="108" width="98" height="132" rx="12" fill="#FFFFFF"/>
  </g>
  <rect x="298" y="98" width="42" height="18" rx="6" fill="#005484"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 142 l6 6 l11 -12" fill="none" stroke="#15803D" stroke-width="4"/>
    <path d="M286 174 l6 6 l11 -12" fill="none" stroke="#15803D" stroke-width="4"/>
    <rect x="286" y="198" width="16" height="16" rx="4" fill="none" stroke="#B6D3E6" stroke-width="3"/>
  </g>
  <rect x="312" y="138" width="44" height="6" rx="3" fill="#B6D3E6"/>
  <rect x="312" y="150" width="30" height="6" rx="3" fill="#DCEBF5"/>
  <rect x="312" y="170" width="44" height="6" rx="3" fill="#B6D3E6"/>
  <rect x="312" y="182" width="30" height="6" rx="3" fill="#DCEBF5"/>
  <rect x="312" y="202" width="44" height="6" rx="3" fill="#B6D3E6"/>

