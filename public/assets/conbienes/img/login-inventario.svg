  </g>
  <g fill="#1F2937">
    <rect x="32" y="206" width="3" height="22"/><rect x="38" y="206" width="2" height="22"/>
    <rect x="43" y="206" width="4" height="22"/><rect x="50" y="206" width="2" height="22"/>
    <rect x="55" y="206" width="3" height="22"/><rect x="61" y="206" width="2" height="22"/>
    <rect x="66" y="206" width="4" height="22"/><rect x="73" y="206" width="2" height="22"/>
    <rect x="77" y="206" width="3" height="22"/>
  </g>
  <rect x="38" y="232" width="36" height="4" rx="2" fill="#B6D3E6"/>

  <path d="M330 52 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z" fill="#FDE68A"/>
  <circle cx="44" cy="96" r="4" fill="#7DD3FC"/>
  <circle cx="372" cy="264" r="3" fill="#FFFFFF" opacity=".7"/>
