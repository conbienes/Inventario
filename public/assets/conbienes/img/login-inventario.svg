<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Módulo de Inventario">
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#001F33" flood-opacity=".35"/>
    </filter>
    <linearGradient id="caja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBD38D"/>
      <stop offset="1" stop-color="#F0B35A"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="160" r="138" fill="#FFFFFF" opacity=".06"/>
  <circle cx="200" cy="160" r="104" fill="#FFFFFF" opacity=".06"/>

  <!-- piso -->
  <ellipse cx="200" cy="270" rx="160" ry="14" fill="#001F33" opacity=".25"/>

  <!-- estantería -->
  <g filter="url(#sombra)">
    <rect x="70" y="54" width="10" height="214" rx="3" fill="#E8F3FA"/>
    <rect x="250" y="54" width="10" height="214" rx="3" fill="#E8F3FA"/>
    <rect x="66" y="118" width="198" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="66" y="190" width="198" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="66" y="258" width="198" height="10" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- cajas nivel 1 -->
  <rect x="90" y="76" width="52" height="42" rx="4" fill="url(#caja)"/>
  <rect x="110" y="76" width="12" height="16" fill="#FFFFFF" opacity=".6"/>
  <rect x="148" y="88" width="40" height="30" rx="4" fill="#7FB4D6"/>
  <rect x="162" y="88" width="12" height="10" fill="#FFFFFF" opacity=".6"/>
  <rect x="194" y="70" width="48" height="48" rx="4" fill="url(#caja)"/>
  <rect x="212" y="70" width="12" height="18" fill="#FFFFFF" opacity=".6"/>

  <!-- cajas nivel 2 -->
  <rect x="88" y="150" width="44" height="40" rx="4" fill="#7FB4D6"/>
  <rect x="104" y="150" width="12" height="14" fill="#FFFFFF" opacity=".6"/>
  <rect x="138" y="140" width="56" height="50" rx="4" fill="url(#caja)"/>
  <rect x="160" y="140" width="12" height="18" fill="#FFFFFF" opacity=".6"/>
  <rect x="200" y="160" width="42" height="30" rx="4" fill="#3E8BBE"/>
  <rect x="215" y="160" width="12" height="10" fill="#FFFFFF" opacity=".5"/>

  <!-- cajas nivel 3 -->
  <rect x="92" y="218" width="60" height="40" rx="4" fill="url(#caja)"/>
  <rect x="116" y="218" width="12" height="14" fill="#FFFFFF" opacity=".6"/>
  <rect x="160" y="228" width="38" height="30" rx="4" fill="#7FB4D6"/>

